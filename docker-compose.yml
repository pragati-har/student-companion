version: '3.9'

services:
  # Next.js web application
  web:
    build:
      context: .
      target: nextjs
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    depends_on:
      - socket
    restart: unless-stopped

  # Standalone Socket.IO + cron reminder server
  socket:
    build:
      context: .
      target: socketserver
    ports:
      - '4000:4000'
    env_file:
      - .env.local
    restart: unless-stopped
