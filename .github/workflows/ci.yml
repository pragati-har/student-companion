name: CI — Lint, Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test
        env:
          JWT_SECRET: test-secret-for-ci-only
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test

      - name: Build production bundle
        run: npm run build
        env:
          # Stub values so Next.js build doesn't fail on missing env vars
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: build-secret-for-ci-only
          JWT_EXPIRES_IN: 7d
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
          NODE_ENV: production

      - name: Build Next.js Docker target
        run: docker build --target nextjs --build-arg NEXT_PUBLIC_SOCKET_URL=http://localhost:4000 --tag student-companion-nextjs:ci .

      - name: Build Socket.IO Docker target
        run: docker build --target socketserver --tag student-companion-socketserver:ci .
